<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070910">
  <meta name="description" content="STORE MY ONLY - Opening">
  <title>STORE MY ONLY | Opening</title>
  <style>
    :root { color-scheme: dark; --gold:#e7c783; --pale:#fff1ce; }
    * { box-sizing: border-box; }
    html, body { width:100%; min-height:100%; margin:0; }
    body {
      min-height:100svh; overflow:hidden; color:#f8f0df;
      background:#070910;
      font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    }
    .stage {
      position:relative; display:grid; min-height:100svh; place-items:center;
      overflow:hidden; isolation:isolate; padding:30px 20px;
      background:
        radial-gradient(ellipse at 50% 48%,rgba(116,79,34,.28),transparent 34%),
        radial-gradient(ellipse at 50% 110%,rgba(98,51,24,.25),transparent 55%),
        linear-gradient(145deg,#171923 0%,#090b13 54%,#05060a 100%);
    }
    #effects { position:absolute; inset:0; width:100%; height:100%; z-index:-1; }
    .hill-silhouette {
      position:absolute; left:-2%; bottom:-1px; z-index:0;
      width:min(58vw,760px); height:27vh; min-height:150px;
      pointer-events:none;
      background:linear-gradient(165deg,#171923 0%,#0b0d15 58%,#05060a 100%);
      clip-path:polygon(0 100%,0 72%,7% 67%,13% 54%,19% 49%,25% 36%,31% 42%,38% 25%,44% 31%,51% 17%,57% 24%,64% 39%,70% 42%,77% 57%,84% 61%,91% 76%,100% 81%,100% 100%);
      filter:drop-shadow(0 -2px 8px rgba(231,199,131,.13));
    }
    .hill-silhouette::before {
      content:""; position:absolute; inset:0;
      background:linear-gradient(180deg,rgba(231,199,131,.13),transparent 3%,transparent);
      clip-path:polygon(0 72%,7% 67%,13% 54%,19% 49%,25% 36%,31% 42%,38% 25%,44% 31%,51% 17%,57% 24%,64% 39%,70% 42%,77% 57%,84% 61%,91% 76%,100% 81%,100% 84%,91% 79%,84% 64%,77% 60%,70% 45%,64% 42%,57% 27%,51% 20%,44% 34%,38% 28%,31% 45%,25% 39%,19% 52%,13% 57%,7% 70%,0 75%);
    }
    .vignette { position:absolute; inset:0; z-index:-1; pointer-events:none;
      background:radial-gradient(ellipse,transparent 25%,rgba(0,0,0,.28) 72%,#030408 120%); }
    .light-beam {
      position:absolute; z-index:-1; top:-35%; left:-35%; width:24%; height:170%;
      opacity:0; transform:rotate(28deg);
      background:linear-gradient(90deg,transparent,rgba(255,231,178,.24),rgba(255,255,255,.78),rgba(255,220,148,.2),transparent);
      filter:blur(9px); animation:beamSweep 2.2s 1.35s ease-out forwards;
    }
    .sigil {
      position:absolute; z-index:-1; left:50%; top:43%; width:min(72vw,620px); aspect-ratio:1;
      border:1px solid rgba(232,194,120,.0); border-radius:50%;
      opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(-70deg);
      background:
        repeating-conic-gradient(from 0deg,rgba(238,203,137,.0) 0deg 8deg,rgba(238,203,137,.55) 8.15deg 8.35deg,rgba(238,203,137,0) 8.5deg 15deg);
      mask:radial-gradient(circle,transparent 48%,#000 48.4% 49%,transparent 49.4% 57%,#000 57.4% 57.8%,transparent 58.2% 69%,#000 69.4% 69.8%,transparent 70.2%);
      animation:sigilReveal 2.5s .25s cubic-bezier(.15,.7,.2,1) forwards, sigilTurn 42s 2.8s linear infinite;
      filter:drop-shadow(0 0 12px rgba(231,199,131,.4));
    }
    .sigil::before,.sigil::after {
      content:""; position:absolute; inset:18%; border:1px solid rgba(238,203,137,.65);
      transform:rotate(45deg); box-shadow:0 0 22px rgba(231,199,131,.18);
    }
    .sigil::after { transform:rotate(0); inset:27%; border-color:rgba(238,203,137,.42); }
    .shockwave {
      position:absolute; z-index:-1; left:50%; top:43%; width:12px; aspect-ratio:1;
      border:2px solid rgba(255,232,180,.9); border-radius:50%;
      opacity:0; transform:translate(-50%,-50%);
      box-shadow:0 0 28px rgba(255,216,143,.7),inset 0 0 20px rgba(255,216,143,.3);
      animation:shockwave 1.35s 1.45s cubic-bezier(.08,.6,.18,1) forwards;
    }
    .frame {
      position:absolute; inset:5%; border:1px solid rgba(222,187,119,.18);
      clip-path:polygon(0 0,22% 0,24% 1px,76% 1px,78% 0,100% 0,100% 22%,calc(100% - 1px) 24%,calc(100% - 1px) 76%,100% 78%,100% 100%,78% 100%,76% calc(100% - 1px),24% calc(100% - 1px),22% 100%,0 100%,0 78%,1px 76%,1px 24%,0 22%);
      opacity:0; animation:frameIn 1.4s .5s ease forwards;
    }
    .corner { position:absolute; width:58px; height:58px; border-color:rgba(231,199,131,.65); border-style:solid; opacity:0; animation:cornerIn .8s 1s ease forwards; }
    .tl { top:5%; left:5%; border-width:1px 0 0 1px; }
    .tr { top:5%; right:5%; border-width:1px 1px 0 0; }
    .bl { bottom:5%; left:5%; border-width:0 0 1px 1px; }
    .br { bottom:5%; right:5%; border-width:0 1px 1px 0; }
    .content { width:min(1050px,100%); text-align:center; position:relative; z-index:1; }
    .eyebrow {
      margin:0 0 24px; color:var(--gold); font-size:.66rem; letter-spacing:.48em;
      opacity:0; transform:translateY(12px); animation:textIn .8s 1.55s ease forwards;
    }
    .crest {
      display:grid; place-items:center; width:66px; height:66px; margin:0 auto 27px;
      border:1px solid rgba(245,218,164,.8); color:var(--pale); font:1.9rem Georgia,serif;
      transform:rotate(45deg) scale(.2); opacity:0;
      box-shadow:0 0 26px rgba(235,198,127,.38),inset 0 0 18px rgba(235,198,127,.16);
      animation:crestPop .8s 1.65s cubic-bezier(.18,1.5,.35,1) forwards,crestPulse 3s 2.5s ease-in-out infinite;
    }
    .crest span { transform:rotate(-45deg); }
    h1 {
      margin:0; color:#fff2d8; font:500 clamp(2.2rem,8.5vw,7rem)/1.08 Georgia,"Times New Roman",serif;
      letter-spacing:.105em; text-indent:.105em; opacity:0; transform:scale(1.13);
      text-shadow:0 0 12px rgba(255,231,180,.8),0 0 42px rgba(224,174,91,.55),0 8px 32px #000;
      animation:logoReveal 1.2s 1.9s cubic-bezier(.15,.8,.2,1) forwards;
    }
    h1 .title-line { display:block; }
    h1 .title-line:last-child {
      margin-top:.1em;
      font-size:.72em;
      letter-spacing:.22em;
    }
    .title-rule {
      display:flex; align-items:center; justify-content:center; gap:15px;
      width:min(460px,75%); margin:26px auto 20px; color:var(--gold);
      opacity:0; animation:textIn .8s 2.6s ease forwards;
    }
    .title-rule::before,.title-rule::after { content:""; height:1px; flex:1; background:linear-gradient(90deg,transparent,var(--gold)); }
    .title-rule::after { transform:scaleX(-1); }
    .tagline {
      margin:0; color:#f0e4cd; font-size:clamp(.88rem,2.2vw,1.15rem);
      letter-spacing:.16em; opacity:0; transform:translateY(10px);
      animation:textIn .8s 2.85s ease forwards;
    }
    .subline { margin:13px 0 0; color:#b8a98d; font:.7rem Georgia,serif; letter-spacing:.3em;
      opacity:0; animation:textIn .8s 3.05s ease forwards; }
    .start-area { margin-top:clamp(42px,7vh,76px); opacity:0; transform:translateY(15px);
      animation:textIn .8s 3.45s ease forwards; }
    .start-button {
      position:relative; min-width:235px; padding:17px 40px; overflow:hidden;
      border:1px solid #f2d69e; color:#17130d;
      background:linear-gradient(115deg,#a9793e,#f6dfad 48%,#b98d51);
      box-shadow:0 0 22px rgba(229,190,119,.22),0 0 70px rgba(229,190,119,.1);
      cursor:pointer; font:700 .84rem Georgia,serif; letter-spacing:.3em;
      transition:transform .25s,filter .25s,box-shadow .25s;
    }
    .start-button::after { content:""; position:absolute; inset:-80% auto -80% -40%; width:25%;
      background:rgba(255,255,255,.55); filter:blur(9px); transform:rotate(20deg);
      animation:buttonShine 4s 4s ease-in-out infinite; }
    .start-button:hover { transform:translateY(-4px) scale(1.025); filter:brightness(1.12);
      box-shadow:0 8px 38px rgba(229,190,119,.42); }
    .start-button:focus-visible { outline:2px solid white; outline-offset:5px; }
    .button-caption { margin:15px 0 0; color:#918675; font-size:.66rem; letter-spacing:.14em; }
    .back-link { position:absolute; bottom:7%; left:50%; color:#9b9386; font-size:.7rem;
      letter-spacing:.1em; text-decoration:none; transform:translateX(-50%); transition:color .2s; }
    .back-link:hover { color:var(--pale); }
    .version { position:absolute; z-index:3; right:7%; bottom:7%; color:#625d55; font:.62rem Georgia,serif; letter-spacing:.14em; }
    .fade-out { animation:fadeOut .55s ease forwards; pointer-events:none; }
    @keyframes sigilReveal { 0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-70deg)} 65%{opacity:.75} 100%{opacity:.34;transform:translate(-50%,-50%) scale(1) rotate(0)} }
    @keyframes sigilTurn { to{transform:translate(-50%,-50%) scale(1) rotate(360deg)} }
    @keyframes shockwave { 0%{opacity:0; width:12px} 12%{opacity:.9} 100%{opacity:0;width:min(125vw,1500px)} }
    @keyframes beamSweep { 0%{left:-35%;opacity:0} 20%{opacity:.9} 100%{left:135%;opacity:0} }
    @keyframes frameIn { to{opacity:1} }
    @keyframes cornerIn { from{opacity:0;transform:scale(.5)} to{opacity:.85;transform:scale(1)} }
    @keyframes crestPop { to{opacity:1;transform:rotate(45deg) scale(1)} }
    @keyframes crestPulse { 50%{box-shadow:0 0 42px rgba(235,198,127,.58),inset 0 0 24px rgba(235,198,127,.22)} }
    @keyframes logoReveal { 0%{opacity:0;filter:blur(16px);transform:scale(1.13);letter-spacing:.28em} 55%{opacity:1} 100%{opacity:1;filter:blur(0);transform:scale(1);letter-spacing:.105em} }
    @keyframes textIn { to{opacity:1;transform:translateY(0)} }
    @keyframes buttonShine { 0%,65%{left:-40%} 85%,100%{left:130%} }
    @keyframes fadeOut { to{opacity:0;transform:scale(1.04);filter:blur(9px)} }
    @media(max-width:600px) {
      .stage { padding:24px 16px; }
      .frame { inset:4%; }
      .corner { width:32px; height:32px; }
      .tl,.tr { top:4%; } .bl,.br { bottom:4%; }
      .tl,.bl { left:4%; } .tr,.br { right:4%; }
      .eyebrow { font-size:.54rem; letter-spacing:.28em; }
      .crest { width:54px; height:54px; font-size:1.5rem; }
      .tagline { letter-spacing:.07em; }
      .sigil { width:105vw; }
      .back-link { bottom:5%; font-size:.62rem; white-space:nowrap; }
      .version { display:none; }
    }
    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; animation-delay:0ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
      .content,.eyebrow,.crest,h1,.title-rule,.tagline,.subline,.start-area,.frame,.corner { opacity:1; transform:none; filter:none; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="effects" aria-hidden="true"></canvas>
    <div class="sigil" aria-hidden="true"></div>
    <div class="shockwave" aria-hidden="true"></div>
    <div class="light-beam" aria-hidden="true"></div>
    <div class="hill-silhouette" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true"></div>
    <span class="corner tl" aria-hidden="true"></span>
    <span class="corner tr" aria-hidden="true"></span>
    <span class="corner bl" aria-hidden="true"></span>
    <span class="corner br" aria-hidden="true"></span>

    <section class="content" aria-labelledby="game-title">
      <p class="eyebrow">A FANTASY SHOP MANAGEMENT SIMULATION</p>
      <div class="crest" aria-hidden="true"><span>✦</span></div>
      <h1 id="game-title"><span class="title-line">STORE</span><span class="title-line">MY ONLY</span></h1>
      <div class="title-rule" aria-hidden="true">✧</div>
      <p class="tagline">リアリティのある世界で、自分だけの店を経営しよう。</p>
      <p class="subline">YOUR STORY. YOUR STORE.</p>
      <div class="start-area">
        <button class="start-button" id="start-button" type="button">GAME START</button>
        <p class="button-caption">PRESS ENTER OR SPACE</p>
      </div>
    </section>

    <a class="back-link" href="./index.html">← BACK TO OFFICIAL WEBSITE</a>
    <span class="version">STORE MY ONLY</span>
  </main>

  <script>
    (() => {
      const stage = document.getElementById("stage");
      const startButton = document.getElementById("start-button");
      const canvas = document.getElementById("effects");
      const ctx = canvas.getContext("2d");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let particles = [], w = 0, h = 0, frame = 0;

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
        w = innerWidth; h = innerHeight;
        canvas.width = Math.floor(w * ratio);
        canvas.height = Math.floor(h * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        particles = Array.from({length:Math.min(125,Math.floor(w/9))}, () => ({
          x:Math.random()*w, y:Math.random()*h,
          r:Math.random()*1.8+.35, vy:Math.random()*1.15+.25,
          vx:(Math.random()-.5)*.55, a:Math.random()*.65+.15,
          twinkle:Math.random()*Math.PI*2
        }));
      }

      function draw() {
        ctx.clearRect(0,0,w,h);
        for (const p of particles) {
          p.y -= p.vy; p.x += p.vx; p.twinkle += .035;
          if (p.y < -5) { p.y=h+5; p.x=Math.random()*w; }
          if (p.x < -5) p.x=w+5;
          if (p.x > w+5) p.x=-5;
          const alpha = p.a*(.65+.35*Math.sin(p.twinkle));
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle = `rgba(255,211,137,${alpha})`;
          ctx.shadowBlur = 12; ctx.shadowColor = "rgba(255,196,105,.8)"; ctx.fill();
        }
        ctx.shadowBlur=0;
        frame=requestAnimationFrame(draw);
      }

      function startGame() {
        if (stage.classList.contains("fade-out")) return;
        stage.classList.add("fade-out");
        setTimeout(() => { location.href="./frame.html"; }, reduced ? 0 : 550);
      }

      startButton.addEventListener("click",startGame);
      addEventListener("keydown",event => {
        if ((event.code==="Enter" || event.code==="Space") &&
            !(event.target instanceof HTMLButtonElement) &&
            !(event.target instanceof HTMLAnchorElement)) {
          event.preventDefault(); startGame();
        }
      });
      resize();
      if (!reduced) draw();
      addEventListener("resize",resize);
      addEventListener("pagehide",()=>cancelAnimationFrame(frame));
    })();
  </script>
</body>
</html>
