<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="STORE MY ONLY - Game Start">
  <title>STORE MY ONLY | Opening</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #d9b879;
      --gold-light: #f4dfb2;
      --muted: #b8b0a1;
      --night: #090b10;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: #f5f0e5;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(107, 77, 39, .24), transparent 34%),
        radial-gradient(ellipse at 50% 100%, rgba(92, 52, 25, .18), transparent 52%),
        linear-gradient(145deg, #171923 0%, #0b0d13 48%, #08090d 100%);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    button { font: inherit; }

    .opening {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
      padding: 36px 22px;
    }

    .opening::before,
    .opening::after {
      position: absolute;
      z-index: -1;
      content: "";
      pointer-events: none;
    }

    .opening::before {
      inset: 5.5%;
      border: 1px solid rgba(217, 184, 121, .22);
      clip-path: polygon(0 0, 22% 0, 24% 1px, 76% 1px, 78% 0, 100% 0, 100% 22%, calc(100% - 1px) 24%, calc(100% - 1px) 76%, 100% 78%, 100% 100%, 78% 100%, 76% calc(100% - 1px), 24% calc(100% - 1px), 22% 100%, 0 100%, 0 78%, 1px 76%, 1px 24%, 0 22%);
    }

    .opening::after {
      inset: 0;
      opacity: .4;
      background:
        linear-gradient(90deg, transparent 49.95%, rgba(217,184,121,.07) 50%, transparent 50.05%),
        linear-gradient(0deg, transparent 49.95%, rgba(217,184,121,.05) 50%, transparent 50.05%);
      mask-image: radial-gradient(ellipse, #000 0%, transparent 72%);
    }

    #embers {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 54px;
      height: 54px;
      border-color: rgba(217, 184, 121, .58);
      border-style: solid;
      opacity: .8;
    }

    .corner-tl { top: 5.5%; left: 5.5%; border-width: 1px 0 0 1px; }
    .corner-tr { top: 5.5%; right: 5.5%; border-width: 1px 1px 0 0; }
    .corner-bl { bottom: 5.5%; left: 5.5%; border-width: 0 0 1px 1px; }
    .corner-br { right: 5.5%; bottom: 5.5%; border-width: 0 1px 1px 0; }

    .content {
      width: min(920px, 100%);
      text-align: center;
      animation: reveal 1.35s cubic-bezier(.2,.75,.2,1) both;
    }

    .eyebrow {
      margin: 0 0 30px;
      color: var(--gold);
      font-size: .68rem;
      letter-spacing: .48em;
      text-transform: uppercase;
    }

    .crest {
      display: grid;
      width: 74px;
      height: 74px;
      margin: 0 auto 28px;
      place-items: center;
      border: 1px solid rgba(217,184,121,.58);
      color: var(--gold-light);
      font: 2rem Georgia, serif;
      transform: rotate(45deg);
      box-shadow: 0 0 34px rgba(217,184,121,.12), inset 0 0 22px rgba(217,184,121,.08);
    }

    .crest span { transform: rotate(-45deg); }

    h1 {
      margin: 0;
      color: #f5ead4;
      font: 500 clamp(2.25rem, 8.3vw, 6.6rem)/1.12 Georgia, "Times New Roman", serif;
      letter-spacing: .105em;
      text-indent: .105em;
      text-shadow: 0 0 34px rgba(230,190,121,.2), 0 5px 28px #000;
    }

    .title-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: min(420px, 72%);
      margin: 28px auto 22px;
      color: var(--gold);
    }

    .title-rule::before,
    .title-rule::after {
      height: 1px;
      flex: 1;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(217,184,121,.8));
    }

    .title-rule::after { transform: scaleX(-1); }

    .tagline {
      margin: 0;
      color: #e4d9c5;
      font-size: clamp(.9rem, 2.2vw, 1.12rem);
      letter-spacing: .18em;
    }

    .subline {
      margin: 13px 0 0;
      color: #938b7e;
      font: .72rem Georgia, serif;
      letter-spacing: .28em;
    }

    .start-area {
      margin-top: clamp(52px, 9vh, 88px);
    }

    .start-button {
      position: relative;
      min-width: 220px;
      padding: 16px 38px;
      overflow: hidden;
      border: 1px solid rgba(240,216,168,.9);
      color: #17130d;
      background: linear-gradient(120deg, #b58a4e, #f2d8a5 48%, #bd965d);
      box-shadow: 0 0 28px rgba(217,184,121,.14);
      cursor: pointer;
      font: 700 .82rem Georgia, serif;
      letter-spacing: .28em;
      transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
    }

    .start-button::before {
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
      transform: skewX(-22deg);
      transition: left .6s ease;
    }

    .start-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
      box-shadow: 0 8px 34px rgba(217,184,121,.24);
    }

    .start-button:hover::before { left: 150%; }
    .start-button:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }

    .button-caption {
      margin: 17px 0 0;
      color: #827b70;
      font-size: .68rem;
      letter-spacing: .12em;
    }

    .back-link {
      position: absolute;
      bottom: max(7.5%, 24px);
      left: 50%;
      color: #9b9386;
      font-size: .72rem;
      letter-spacing: .1em;
      text-decoration: none;
      transform: translateX(-50%);
      transition: color .2s;
    }

    .back-link:hover { color: var(--gold-light); }

    .version {
      position: absolute;
      right: max(7.5%, 24px);
      bottom: max(7.5%, 24px);
      color: #625d55;
      font: .65rem Georgia, serif;
      letter-spacing: .12em;
    }

    .fade-out {
      animation: fadeOut .55s ease forwards;
      pointer-events: none;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(18px); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: scale(1.025); filter: blur(8px); }
    }

    @media (max-width: 600px) {
      .opening { padding: 28px 18px; }
      .opening::before { inset: 4%; }
      .corner { width: 32px; height: 32px; }
      .corner-tl, .corner-tr { top: 4%; }
      .corner-bl, .corner-br { bottom: 4%; }
      .corner-tl, .corner-bl { left: 4%; }
      .corner-tr, .corner-br { right: 4%; }
      .eyebrow { font-size: .57rem; letter-spacing: .3em; }
      .crest { width: 58px; height: 58px; font-size: 1.6rem; }
      .tagline { letter-spacing: .08em; }
      .back-link { bottom: 6%; }
      .version { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="opening" id="opening">
    <canvas id="embers" aria-hidden="true"></canvas>
    <span class="corner corner-tl" aria-hidden="true"></span>
    <span class="corner corner-tr" aria-hidden="true"></span>
    <span class="corner corner-bl" aria-hidden="true"></span>
    <span class="corner corner-br" aria-hidden="true"></span>

    <section class="content" aria-labelledby="game-title">
      <p class="eyebrow">A FANTASY SHOP MANAGEMENT SIMULATION</p>
      <div class="crest" aria-hidden="true"><span>✦</span></div>
      <h1 id="game-title">STORE MY ONLY</h1>
      <div class="title-rule" aria-hidden="true">✧</div>
      <p class="tagline">リアリティのある世界で、自分だけの店を経営しよう。</p>
      <p class="subline">YOUR STORY. YOUR STORE.</p>

      <div class="start-area">
        <button class="start-button" id="start-button" type="button">GAME START</button>
        <p class="button-caption">PRESS ENTER OR SPACE</p>
      </div>
    </section>

    <a class="back-link" href="./index.html">← BACK TO OFFICIAL WEBSITE</a>
    <span class="version">STORE MY ONLY</span>
  </main>

  <script>
    (() => {
      const opening = document.getElementById("opening");
      const startButton = document.getElementById("start-button");
      const canvas = document.getElementById("embers");
      const context = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let particles = [];
      let width = 0;
      let height = 0;
      let animationFrame = 0;

      function resizeCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, 1.6);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        particles = Array.from({ length: Math.min(70, Math.floor(width / 17)) }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.7 + .35,
          speed: Math.random() * .34 + .12,
          drift: (Math.random() - .5) * .28,
          alpha: Math.random() * .5 + .15
        }));
      }

      function drawParticles() {
        context.clearRect(0, 0, width, height);
        for (const particle of particles) {
          particle.y -= particle.speed;
          particle.x += particle.drift;
          if (particle.y < -8) {
            particle.y = height + 8;
            particle.x = Math.random() * width;
          }
          if (particle.x < -8) particle.x = width + 8;
          if (particle.x > width + 8) particle.x = -8;

          context.beginPath();
          context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
          context.fillStyle = `rgba(232, 190, 119, ${particle.alpha})`;
          context.shadowBlur = 10;
          context.shadowColor = "rgba(232, 190, 119, .55)";
          context.fill();
        }
        context.shadowBlur = 0;
        animationFrame = window.requestAnimationFrame(drawParticles);
      }

      function startGame() {
        if (opening.classList.contains("fade-out")) return;
        opening.classList.add("fade-out");
        window.setTimeout(() => {
          window.location.href = "./frame.html";
        }, reduceMotion ? 0 : 520);
      }

      startButton.addEventListener("click", startGame);
      window.addEventListener("keydown", (event) => {
        if (event.code === "Enter" || event.code === "Space") {
          if (event.target instanceof HTMLButtonElement || event.target instanceof HTMLAnchorElement) return;
          event.preventDefault();
          startGame();
        }
      });

      resizeCanvas();
      if (!reduceMotion) drawParticles();
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("pagehide", () => window.cancelAnimationFrame(animationFrame));
    })();
  </script>
</body>
</html>
