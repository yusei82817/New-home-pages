<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111318">
  <title>Store My Only</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111318;
      color: #f4f5f7;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .game-header {
      height: 54px;
      flex: 0 0 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      background: #1b1e26;
      border-bottom: 1px solid #303541;
    }

    .game-title {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: .04em;
    }

    .game-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .game-status {
      color: #aeb5c2;
      font-size: 12px;
    }

    #fullscreen-button {
      border: 1px solid #454c5b;
      border-radius: 7px;
      padding: 7px 11px;
      background: #292e39;
      color: #f4f5f7;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    #fullscreen-button:hover {
      background: #373e4b;
    }

    #game-container {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      background: #090a0d;
    }

    #game-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #090a0d;
    }

    #game-container:fullscreen {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 480px) {
      .game-header {
        height: 48px;
        flex-basis: 48px;
        padding: 0 12px;
      }

      .game-title { font-size: 14px; }
      .game-status { display: none; }
    }
  </style>
</head>
<body>
  <header class="game-header">
    <h1 class="game-title">Store My Only</h1>
    <div class="game-actions">
      <span class="game-status">GAME</span>
      <button id="fullscreen-button" type="button" aria-label="ゲームを全画面表示">
        全画面表示
      </button>
    </div>
  </header>

  <main id="game-container">
    <iframe
      id="game-frame"
      src="./game.html"
      title="Store My Only ゲーム画面"
      allow="fullscreen; autoplay"
      allowfullscreen
      loading="eager"
    ></iframe>
  </main>

  <script>
    const container = document.getElementById("game-container");
    const fullscreenButton = document.getElementById("fullscreen-button");

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await container.requestFullscreen();
        }
      } catch (error) {
        console.error("全画面表示を切り替えられませんでした:", error);
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent = document.fullscreenElement
        ? "全画面表示を終了"
        : "全画面表示";
    });
  </script>
</body>
</html>
